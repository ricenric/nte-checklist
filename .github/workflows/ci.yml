name: CI Sync Health Check

on:
  push:
    branches: [ main, subtext-update ]
  pull_request:
    branches: [ main ]

jobs:
  run-sync-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install testing dependencies
        run: npm install

      - name: Run Supabase Endpoint Assertion
        run: npm test