<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div class="w-full max-w-6xl mx-auto p-6 space-y-6">
        
        <div class="w-full flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider text-cyan-400 uppercase">Neverness to Everness</h1>
                <p class="text-xs text-slate-400 tracking-widest uppercase">HELPER Checklist System</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 self-start sm:self-center">
                <div id="sync-status" class="text-xs font-mono px-2 py-1 rounded border bg-slate-800 border-slate-700 text-slate-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-slate-500"></span> Local-Only Mode
                </div>
                <div id="et-clock" class="text-sm font-mono bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400">
                    Loading ET Clock...
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="w-full bg-slate-800/40 border border-cyan-500/20 backdrop-blur-md rounded-xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="w-full flex items-center justify-between mb-4 gap-2">
                        <h2 class="text-xl font-bold tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Daily Priorities
                        </h2>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs font-mono px-2 py-0.5 rounded border bg-cyan-500/10 text-cyan-400 border-cyan-500/20">Resets 5 AM ET</span>
                            <span id="daily-timer" class="text-[11px] font-mono text-slate-400 mt-1">--h --m left</span>
                        </div>
                    </div>
                    <div id="daily-list" class="w-full divide-y divide-slate-800"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="w-full bg-slate-800/40 border border-purple-500/20 backdrop-blur-md rounded-xl p-5 shadow-xl">
                    <div class="w-full flex items-center justify-between mb-4 gap-2">
                        <h2 class="text-xl font-bold tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span> Weekly Priorities
                        </h2>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs font-mono px-2 py-0.5 rounded border bg-purple-500/10 text-purple-400 border-purple-500/20">Resets Mon 5 AM ET</span>
                            <span id="weekly-timer" class="text-[11px] font-mono text-slate-400 mt-1">--d --h left</span>
                        </div>
                    </div>
                    <div id="weekly-list" class="w-full divide-y divide-slate-800"></div>
                </div>

                <div class="w-full bg-slate-800/40 border border-emerald-500/20 backdrop-blur-md rounded-xl p-5 shadow-xl">
                    <div class="w-full flex items-center justify-between mb-4 gap-2">
                        <h2 class="text-xl font-bold tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Bi-Weekly Priorities
                        </h2>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs font-mono px-2 py-0.5 rounded border bg-emerald-500/10 text-emerald-400 border-emerald-500/20">Every 2 Weeks</span>
                            <span id="biweekly-timer" class="text-[11px] font-mono text-slate-400 mt-1">--d --h left</span>
                        </div>
                    </div>
                    <div id="biweekly-list" class="w-full divide-y divide-slate-800"></div>
                </div>

                <div class="w-full bg-slate-800/40 border border-amber-500/20 backdrop-blur-md rounded-xl p-5 shadow-xl">
                    <div class="w-full flex items-center justify-between mb-4 gap-2">
                        <h2 class="text-xl font-bold tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Monthly Shop
                        </h2>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-xs font-mono px-2 py-0.5 rounded border bg-amber-500/10 text-amber-400 border-amber-500/20">Resets 1st @ 5 AM ET</span>
                            <span id="monthly-timer" class="text-[11px] font-mono text-slate-400 mt-1">--d --h left</span>
                        </div>
                    </div>
                    <div id="monthly-list" class="w-full divide-y divide-slate-800"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- YOUR SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://zpdvqtmxvkzkycvoqvyp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9jyt1HHwYZcvW-nOXl2iMw_LAUSe50Q";
        let supabase = null;

        // Initialize using the modern library entrypoint
        if (SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL" && SUPABASE_URL !== "") {
            // Note: The modern library exports globally as `supabase` directly, 
            // but to avoid collisions we call createClient from the window scope
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const defaultDailies = [
            "Manage Cafe & Collect Fons", "Make a Wish at Nacupeda's Pool", "Pray at the Fortune Shades Tree",
            "Bond Event (Movies, Ferris Wheel)", "Witch's House Daily Fortune Readings", "Give Gifts to Characters (Max 10)",
            "Get Daily Free Module", "Farm Anomaly Furniture Materials", "Farm Fons with Chiz", "Beat Up Civilians for Items"
        ];
        const defaultWeeklies = [
            "Defeat 3 Weekly Bosses (Anomaly Pilgrimage)", "Burn all City Stamina", "Clear Special Delivery Commission (Old Mailbox)",
            "Enter Realm of Greed & defeat Mammon Boss", "Visit Ebisu's Auction House", "Complete Weekly Battle Pass Missions"
        ];
        const defaultBiweeklies = ["Pink Paws Heist"];
        const defaultMonthlies = ["Hunter Exchange"];

        let state = {
            dailies: {}, weeklies: {}, biweeklies: {}, monthlies: {},
            lastCheckedDaily: 0, lastCheckedWeekly: 0, lastCheckedBiweekly: 0, lastCheckedMonthly: 0
        };

        let syncKey = "";
        const BIWEEKLY_ANCHOR = new Date("2026-06-08T05:00:00-04:00").getTime();

        function getTargetResets() {
            const etString = new Date().toLocaleString("en-US", { timeZone: "America/New_York" });
            const nowET = new Date(etString);
            const currentTimestamp = nowET.getTime();

            let dReset = new Date(nowET); dReset.setHours(5, 0, 0, 0);
            if (nowET < dReset) dReset.setDate(dReset.getDate() - 1);
            const dailyTarget = dReset.getTime();

            let wReset = new Date(dailyTarget);
            const daysSinceMonday = (wReset.getDay() === 0) ? 6 : wReset.getDay() - 1;
            wReset.setDate(wReset.getDate() - daysSinceMonday);
            const weeklyTarget = wReset.getTime();

            let biweeklyTarget = BIWEEKLY_ANCHOR;
            const msPerTwoWeeks = 14 * 24 * 60 * 60 * 1000;
            if (currentTimestamp >= BIWEEKLY_ANCHOR) {
                biweeklyTarget = BIWEEKLY_ANCHOR + (Math.floor((currentTimestamp - BIWEEKLY_ANCHOR) / msPerTwoWeeks) * msPerTwoWeeks);
            } else {
                biweeklyTarget = BIWEEKLY_ANCHOR - msPerTwoWeeks;
            }

            let mReset = new Date(nowET); mReset.setDate(1); mReset.setHours(5, 0, 0, 0);
            if (nowET < mReset) { mReset.setMonth(mReset.getMonth() - 1); mReset.setDate(1); mReset.setHours(5, 0, 0, 0); }
            return { dailyTarget, weeklyTarget, biweeklyTarget, monthlyTarget: mReset.getTime(), nowET };
        }

        function formatCountdown(ms) {
            if (ms < 0) return "Resetting...";
            const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
            return d > 0 ? `${d}d ${h % 24}h left` : `${h % 24}h ${m % 60}m ${s % 60}s left`;
        }

        function updateTimers() {
            const { dailyTarget, weeklyTarget, biweeklyTarget, monthlyTarget, nowET } = getTargetResets();
            const currentMs = nowET.getTime();
            document.getElementById('daily-timer').innerText = formatCountdown((dailyTarget + 86400000) - currentMs);
            document.getElementById('weekly-timer').innerText = formatCountdown((weeklyTarget + 604800000) - currentMs);
            document.getElementById('biweekly-timer').innerText = formatCountdown((biweeklyTarget + 1209600000) - currentMs);
            let nm = new Date(monthlyTarget); nm.setMonth(nm.getMonth() + 1);
            document.getElementById('monthly-timer').innerText = formatCountdown(nm.getTime() - currentMs);
        }

        function updateClock() {
            document.getElementById('et-clock').innerText = "✦ " + new Date().toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true }) + " ET";
            updateTimers();
        }

        async function initApp() {
        // 1. Determine or set up the tracking hash handle
        if (!window.location.hash || window.location.hash.length < 5) {
            const newKey = "#user-" + Math.random().toString(36).substring(2, 11) + Math.random().toString(36).substring(2, 11);
            window.location.hash = newKey;
        }
        syncKey = window.location.hash;

        // FIX: Tie the localStorage key name directly to this specific user handle
        const localStorageKey = 'nte_state_' + syncKey;

        // 2. Load what we have locally for THIS SPECIFIC USER as a baseline fallback
        const savedState = localStorage.getItem(localStorageKey);
        if (savedState) {
            state = JSON.parse(savedState);
        } else {
            // Clear old memory structures if this is a brand-new user handle
            state = {
                dailies: {}, weeklies: {}, biweeklies: {}, monthlies: {},
                lastCheckedDaily: 0, lastCheckedWeekly: 0, lastCheckedBiweekly: 0, lastCheckedMonthly: 0
            };
        }

        // 3. Connect real-time hooks and pull down cloud data
        if (supabase) {
            const statusDiv = document.getElementById('sync-status');
            statusDiv.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud-Synced (${syncKey})`;
            statusDiv.className = "text-xs font-mono px-2 py-1 rounded border bg-slate-800 border-slate-700 text-emerald-400 flex items-center gap-1.5";
            
            try {
                // Fetch latest global database baseline on load
                let { data, error } = await supabase.from('nte_sync').select('state_json').eq('sync_key', syncKey).maybeSingle();
                
                // If data exists in the cloud, force it to overwrite our local state
                if (data && data.state_json) {
                    state = data.state_json;
                    localStorage.setItem(localStorageKey, JSON.stringify(state));
                }
            } catch(e) { 
                console.error("Initial load error:", e); 
            }
            
            // Listen dynamically for updates while the page is sitting open
            supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'nte_sync', filter: `sync_key=eq.${syncKey}` }, (payload) => {
                if (payload.new && payload.new.state_json) {
                    state = payload.new.state_json;
                    localStorage.setItem(localStorageKey, JSON.stringify(state));
                    renderLists();
                }
            }).subscribe();
        }

        // 4. Handle time resets and fill defaults if empty
        const { dailyTarget, weeklyTarget, biweeklyTarget, monthlyTarget } = getTargetResets();

        if (!state.lastCheckedDaily || state.lastCheckedDaily < dailyTarget) { defaultDailies.forEach(t => state.dailies[t] = false); state.lastCheckedDaily = dailyTarget; }
        if (!state.lastCheckedWeekly || state.lastCheckedWeekly < weeklyTarget) { defaultWeeklies.forEach(t => state.weeklies[t] = false); state.lastCheckedWeekly = weeklyTarget; }
        if (!state.lastCheckedBiweekly || state.lastCheckedBiweekly < biweeklyTarget) { defaultBiweeklies.forEach(t => state.biweeklies[t] = false); state.lastCheckedBiweekly = biweeklyTarget; }
        if (!state.lastCheckedMonthly || state.lastCheckedMonthly < monthlyTarget) { defaultMonthlies.forEach(t => state.monthlies[t] = false); state.lastCheckedMonthly = monthlyTarget; }

        if (!state.biweeklies) state.biweeklies = {}; if (!state.monthlies) state.monthlies = {};
        defaultDailies.forEach(t => { if (state.dailies[t] === undefined) state.dailies[t] = false; });
        defaultWeeklies.forEach(t => { if (state.weeklies[t] === undefined) state.weeklies[t] = false; });
        defaultBiweeklies.forEach(t => { if (state.biweeklies[t] === undefined) state.biweeklies[t] = false; });
        defaultMonthlies.forEach(t => { if (state.monthlies[t] === undefined) state.monthlies[t] = false; });

        localStorage.setItem(localStorageKey, JSON.stringify(state));
        renderLists();
    }

        async function pushStateToCloud() {
        // FIX: Make sure writing updates uses the exact same user-specific storage key
        const localStorageKey = 'nte_state_' + syncKey;
        localStorage.setItem(localStorageKey, JSON.stringify(state));
        
        if (!supabase) return;
        
        try {
            await supabase.from('nte_sync').upsert(
                { sync_key: syncKey, state_json: state, updated_at: new Date().toISOString() },
                { onConflict: 'sync_key' }
            );
        } catch(e) { console.error("Cloud push error:", e); }
    }
        function toggleTask(category, task, checked) { 
            state[category][task] = checked; 
            renderLists(); 
            pushStateToCloud(); 
        }

        function renderLists() {
            const d = document.getElementById('daily-list'), w = document.getElementById('weekly-list'), b = document.getElementById('biweekly-list'), m = document.getElementById('monthly-list');
            d.innerHTML = ''; w.innerHTML = ''; b.innerHTML = ''; m.innerHTML = '';
            defaultDailies.forEach((t, i) => d.appendChild(createTaskRow('dailies', t, state.dailies[t], `d-${i}`, 'checked:bg-cyan-500 checked:border-cyan-500')));
            defaultWeeklies.forEach((t, i) => w.appendChild(createTaskRow('weeklies', t, state.weeklies[t], `w-${i}`, 'checked:bg-purple-500 checked:border-purple-500')));
            defaultBiweeklies.forEach((t, i) => b.appendChild(createTaskRow('biweeklies', t, state.biweeklies[t], `b-${i}`, 'checked:bg-emerald-500 checked:border-emerald-500')));
            defaultMonthlies.forEach((t, i) => m.appendChild(createTaskRow('monthlies', t, state.monthlies[t], `m-${i}`, 'checked:bg-amber-500 checked:border-amber-500')));
        }

        function createTaskRow(category, task, isChecked, id, colorClass) {
            const div = document.createElement('div');
            div.className = "flex items-center py-3 justify-between hover:bg-slate-800/40 px-2 rounded-lg transition-colors group";
            div.innerHTML = `<label class="flex items-center space-x-3 w-full cursor-pointer select-none"><input type="checkbox" id="${id}" ${isChecked ? 'checked' : ''} class="checkbox-custom h-5 w-5 rounded border-slate-700 bg-slate-900/50 text-slate-900 focus:ring-0 focus:ring-offset-0 transition-all appearance-none border checked:after:content-['✓'] checked:after:flex checked:after:justify-center checked:after:text-xs checked:after:font-bold checked:after:text-slate-900 ${colorClass}"><span class="text-slate-200 text-sm font-medium group-hover:text-white transition-colors">${task}</span></label>`;
            div.querySelector('input').addEventListener('change', (e) => toggleTask(category, task, e.target.checked));
            return div;
        }

        initApp(); updateClock();
        setInterval(updateClock, 1000); setInterval(initApp, 30000);

        // Listen for when the user pastes or changes the #hash URL bar manually
        window.addEventListener('hashchange', () => {
        // Force the app to completely re-initialize with the fresh user key
        initApp();
    });
    </script>
